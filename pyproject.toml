[project]
name = "kalon"
version = "0.1.0"
description = "Kalon, an early-stage Python project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kalon = "kalon.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
